{% extends "base.html" %}
{% block title %}Dungeon · Task Dungeon{% endblock %}
{% block content %}
<div id="hud" class="panel">
  <span class="hud-stat">
    <span class="hud-label">Room</span>
    <span class="hud-value"><b id="hud-depth">1</b> / <b id="hud-rooms">—</b></span>
  </span>
  <span class="hud-stat">
    <span class="hud-label">HP</span>
    <span class="bar"><div id="hp-fill"></div></span>
    <span class="hud-value" id="hud-hp"></span>
  </span>
  <span class="hud-stat">
    <span class="hud-label">Atk</span><span class="hud-value" id="hud-atk"></span>
    <span class="hud-label">Def</span><span class="hud-value" id="hud-def"></span>
  </span>
  <span id="hud-items"></span>
</div>
<div id="game"></div>
<p class="controls">Move: WASD / arrow keys · Battle: 1 Attack · 2 Power Strike · 3 Defend · 4-7 Drink a potion · Esc Flee</p>
{% endblock %}
{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<script src="/static/game/main.js"></script>
{% endblock %}
